name: Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          H={"User-Agent":"Mozilla/5.0","Accept":"application/json"}
          B="https://site.api.espn.com/apis/site/v2/sports/basketball/nba/"
          def get(u):
              with urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=30) as r: return json.loads(r.read())
          for rng in ("20261020-20261110","20251021-20260413","20261108"):
              try:
                  d=get(B+f"scoreboard?dates={rng}&limit=1500"); ev=d["events"]
                  print("SB",rng,len(ev),[ (e["id"],e["date"],e["season"],e["status"]["type"]["completed"]) for e in ev[:2]], ev[-1]["date"])
              except Exception as e: print("SB",rng,"ERR",e)
          d=get(B+"scoreboard?dates=20261108"); eid=d["events"][0]["id"]
          e=d["events"][0]; print("EV",json.dumps({k:(v if not isinstance(v,(dict,list)) else "...") for k,v in e.items()}), [c["team"]["displayName"] for c in e["competitions"][0]["competitors"]])
          s=get(B+f"summary?event={eid}"); bp=s["boxscore"]["players"]
          for t in bp:
              print("TEAM",json.dumps(t["team"])[:300]); st=t["statistics"][0]
              print("KEYS",[k for k in st.keys()], st.get("names"), st.get("labels"), st.get("keys"))
              for a in st["athletes"][:2]+st["athletes"][-2:]: print("ATH",json.dumps({k:(v if k!="athlete" else {x:v[x] for x in ("id","displayName") if x in v}) for k,v in a.items()})[:500])
          print("HDR",json.dumps(s["header"]["competitions"][0].get("date")), s["header"].get("season"))
          PY
